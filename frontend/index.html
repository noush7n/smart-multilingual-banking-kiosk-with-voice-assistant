<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Banking Kiosk - Setup Test</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "Nirmala UI", Arial, sans-serif;
      background: #F3EFF5;
      color: #30283A;
    }
    header {
      background: #51445F;
      color: #FFFFFF;
      padding: 20px 32px;
      font-size: 1.5rem;
    }
    main {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #D9D1DF;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(48, 40, 58, 0.08);
    }
    button {
      background: #51445F;
      color: #FFFFFF;
      border: 0;
      border-radius: 10px;
      padding: 16px 28px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:hover { background: #6B5B7E; }
    #result { margin-top: 20px; font-weight: 600; }
    .ok  { color: #4F8065; }
    .bad { color: #B6535C; }
  </style>
</head>
<body>
  <header>Smart Multilingual Banking Kiosk (Demo)</header>
  <main>
    <div class="card">
      <h1>Setup test</h1>
      <p>Hindi text check: स्वागत है — बैंकिंग कियोस्क में आपका स्वागत है</p>
      <button id="testBtn">Test backend connection</button>
      <p id="result"></p>
    </div>
  </main>

  <script>
    document.getElementById("testBtn").addEventListener("click", async () => {
      const out = document.getElementById("result");
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        out.textContent = "Backend says: " + data.message;
        out.className = "ok";
      } catch (error) {
        out.textContent = "Could not reach the backend.";
        out.className = "bad";
      }
    });
  </script>
</body>
</html>
