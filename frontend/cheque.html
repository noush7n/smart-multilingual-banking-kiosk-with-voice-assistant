<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deposit Cheque | Smart Bank Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        /* Smart Banking Kiosk - shared styles for every task page (used by templates/task_base.html).
   The page colour is set with <body class="blue|green|orange|pink|yellow"> and matches the home-page card. */
        :root {
            --ink: #2b2140;
            --plum: #46395f;
            --plum2: #574874;
            --edge: #7d6ca0;
            --paper: #f5f2f9;
            --sand: #e9ddbf;
            --amber: #c98a1e;
            --soft: #d3c9e3;
            --c: #2f5d8a;
            --cd: #1f4467;
            --gap: clamp(.6rem, 1.9vh, 1.25rem);
            --r: clamp(18px, 3vh, 28px);
        }

        body.blue {
            --c: #2f5d8a;
            --cd: #1f4467;
        }

        body.green {
            --c: #2f7a4f;
            --cd: #1f5736;
        }

        body.orange {
            --c: #a84e14;
            --cd: #7a3809;
        }

        body.pink {
            --c: #a1456f;
            --cd: #752f50;
        }

        body.yellow {
            --c: #e3c25a;
            --cd: #b8972f;
        }

        /* The page never scrolls: it always fits the screen */
        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: "Atkinson Hyperlegible", "Noto Sans Devanagari", "Segoe UI", sans-serif;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#d8cfe6 1.4px, transparent 1.4px);
            background-size: 26px 26px;
            user-select: none;
            touch-action: manipulation;
            font-size: clamp(1.05rem, 2.5vh, 1.35rem);
        }

        html[lang="hi"] body {
            line-height: 1.45;
        }

        .display {
            font-family: "Baloo 2", "Noto Sans Devanagari", sans-serif;
        }

        :focus-visible {
            outline: 5px solid var(--amber);
            outline-offset: 4px;
        }

        [hidden] {
            display: none !important;
        }

        .shell {
            height: 100dvh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }

        /* ---------- top bar ---------- */
        .bar {
            background: var(--plum);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: clamp(.5rem, 1.6vh, .9rem) clamp(1rem, 2vw, 2rem);
        }

        .btn-home {
            min-height: clamp(52px, 8vh, 66px);
            padding: 0 1.4rem;
            border-radius: 20px;
            background: var(--sand);
            color: var(--ink);
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            text-decoration: none;
            border: 3px solid transparent;
        }

        .btn-home:hover {
            background: #f3e9cd;
            color: var(--ink);
        }

        .title {
            flex: 1;
            display: flex;
            align-items: center;
            gap: .8rem;
            font-size: clamp(1.3rem, 3.6vh, 2.1rem);
            font-weight: 700;
            margin: 0;
            min-width: 0;
        }

        .swatch {
            flex: none;
            width: 1.1em;
            height: 1.1em;
            border-radius: 50%;
            background: var(--c);
            border: 3px solid #fff;
        }

        .demo {
            background: var(--amber);
            color: var(--ink);
            font-weight: 700;
            font-size: 1rem;
            border-radius: 999px;
            padding: .2rem .8rem;
        }

        .lang {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            border-radius: 24px;
            background: rgba(20, 12, 36, .35);
            border: 2px solid var(--edge);
        }

        .lang .btn {
            min-height: clamp(44px, 7vh, 56px);
            min-width: 96px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 0;
            color: #fff;
            background: transparent;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lang .btn-check:checked+.btn {
            background: #fff;
            color: var(--ink);
        }

        /* ---------- layout ---------- */
        .layout {
            display: grid;
            grid-template-columns: minmax(290px, 3fr) 8fr;
            gap: var(--gap);
            padding: var(--gap) clamp(1rem, 2vw, 2rem);
            min-height: 0;
        }

        .work {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            min-height: 0;
        }

        /* ---------- voice guide (same orb as the home page) ---------- */
        .guide {
            position: relative;
            overflow: hidden;
            min-height: 0;
            background: var(--plum);
            color: #fff;
            border-radius: var(--r);
            padding: var(--gap);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(.8rem, 2.4vh, 1.5rem);
        }

        .orb-wrap {
            position: relative;
            width: clamp(100px, 22vh, 190px);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            flex: none;
        }

        .orb-wave {
            position: absolute;
            inset: 6%;
            border-radius: 50%;
            border: 3px solid rgba(233, 221, 191, .6);
            opacity: 0;
        }

        .is-speaking .orb-wave {
            animation: wave 2.4s ease-out infinite;
        }

        .orb-wave.w2 {
            animation-delay: .8s;
        }

        .orb-wave.w3 {
            animation-delay: 1.6s;
        }

        @keyframes wave {
            0% {
                transform: scale(1);
                opacity: .75;
            }

            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .orb {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: var(--sand);
            box-shadow: 0 0 0 clamp(6px, 1.3vh, 12px) rgba(233, 221, 191, .22), 0 18px 40px rgba(20, 12, 36, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5%;
        }

        .bar-eq {
            width: 7.5%;
            height: var(--h);
            border-radius: 99px;
            background: var(--plum);
        }

        .is-speaking .bar-eq {
            animation: eq .9s ease-in-out infinite;
            animation-delay: var(--d);
        }

        @keyframes eq {

            0%,
            100% {
                transform: scaleY(.45);
            }

            50% {
                transform: scaleY(1.15);
            }
        }

        .caption {
            position: relative;
            width: 100%;
            margin: 0;
            min-height: 3.2em;
            background: var(--plum2);
            border: 2px solid var(--edge);
            border-radius: 22px;
            padding: clamp(.5rem, 1.6vh, .9rem) .9rem;
            font-size: clamp(1.05rem, 2.5vh, 1.35rem);
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            text-align: center;
        }

        .caption::before {
            content: "";
            position: absolute;
            top: -11px;
            left: calc(50% - 10px);
            width: 18px;
            height: 18px;
            background: var(--plum2);
            border-left: 2px solid var(--edge);
            border-top: 2px solid var(--edge);
            transform: rotate(45deg);
        }

        .dot {
            flex: none;
            width: 1.1em;
            height: 1.1em;
            border-radius: 50%;
            background: var(--dot, var(--sand));
            border: 3px solid #fff;
        }

        .btn-hear {
            min-height: clamp(52px, 8vh, 66px);
            width: 100%;
            border-radius: 20px;
            border: 4px solid transparent;
            background: var(--sand);
            color: var(--ink);
            font-weight: 700;
            font-size: 1.25rem;
        }

        .is-speaking .btn-hear {
            border-color: var(--amber);
        }

        /* ---------- steps + stage ---------- */
        .stepper {
            display: flex;
            gap: .6rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .stepper:empty {
            display: none;
        }

        .stepper li {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .25rem;
            border-bottom: 8px solid #cfc4e0;
            font-weight: 700;
            color: #6a5d85;
            font-size: clamp(1rem, 2.4vh, 1.25rem);
        }

        .stepper .n {
            display: inline-grid;
            place-items: center;
            width: 2em;
            height: 2em;
            border-radius: 50%;
            border: 3px solid currentColor;
        }

        .stepper li.active {
            border-color: var(--c);
            color: var(--ink);
        }

        .stepper li.active .n {
            background: var(--c);
            border-color: var(--c);
            color: #fff;
        }

        .stepper li.done {
            border-color: #2f7a4f;
            color: #2f7a4f;
        }

        .stepper li.done .n {
            background: #2f7a4f;
            border-color: #2f7a4f;
            color: #fff;
        }

        .stage {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #fff;
            border: 3px solid #d8cfe6;
            border-radius: var(--r);
            padding: clamp(.9rem, 2.6vh, 1.8rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .split {
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap);
            align-items: center;
        }

        .split>svg {
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .h1 {
            font-size: clamp(1.8rem, 5vh, 3rem);
            font-weight: 700;
            line-height: 1.12;
            margin: 0 0 .5rem;
        }

        .lead {
            font-size: clamp(1.2rem, 3.2vh, 1.7rem);
            margin: 0 0 1rem;
        }

        .notice {
            border-left: 8px solid #a3201a;
            background: #fbeeee;
            padding: .9rem 1.1rem;
            border-radius: 12px;
            font-size: clamp(1.05rem, 2.5vh, 1.25rem);
        }

        .notice.ok {
            border-color: #2f7a4f;
            background: #eaf5ee;
        }

        .pbar {
            position: relative;
            height: clamp(30px, 5vh, 40px);
            border-radius: 20px;
            background: #e6edf5;
            border: 3px solid var(--c);
            overflow: hidden;
        }

        .pbar i {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: var(--c);
            transition: width .2s;
        }

        .pbar b {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: 1.1rem;
            mix-blend-mode: normal;
        }

        /* ---------- action buttons ---------- */
        .actions {
            display: flex;
            gap: var(--gap);
        }

        .actions:empty {
            display: none;
        }

        .btn-k {
            flex: 1;
            min-height: clamp(60px, 10vh, 84px);
            border-radius: 22px;
            font-size: clamp(1.25rem, 3vh, 1.6rem);
            font-weight: 700;
            border: 4px solid transparent;
            color: #fff;
            background: var(--c);
            box-shadow: 0 6px 0 var(--cd);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            transition: transform .1s, box-shadow .1s;
        }

        body.yellow .btn-k {
            color: var(--ink);
        }

        .btn-k:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 var(--cd);
        }

        .btn-k.ghost {
            background: #fff;
            color: var(--ink);
            border-color: var(--ink);
            box-shadow: 0 6px 0 #cfc4e0;
        }

        .btn-k:disabled {
            opacity: .45;
            box-shadow: none;
        }

        /* ---------- narrow / portrait screens ---------- */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            .guide {
                flex-direction: row;
                padding: .7rem;
                gap: .8rem;
            }

            .orb-wrap {
                width: 78px;
            }

            .caption {
                text-align: left;
                justify-content: flex-start;
                min-height: 0;
                font-size: 1.1rem;
            }

            .caption::before,
            .btn-hear {
                display: none;
            }

            .split {
                grid-template-columns: 1fr;
            }

            .split>svg {
                max-height: 24vh;
            }

            .stepper .lb {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .is-speaking .orb-wave,
            .is-speaking .bar-eq {
                animation: none;
            }

            .btn-k {
                transition: none;
            }
        }
    </style>

    <style>
        .chq {
            animation: lay 2.6s ease-in-out infinite;
        }

        @keyframes lay {

            0%,
            15% {
                transform: translateY(-70px);
            }

            70%,
            100% {
                transform: translateY(0);
            }
        }

        .still .chq {
            animation: none;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
        }

        .field {
            border: 3px solid var(--c);
            border-radius: 20px;
            padding: clamp(.6rem, 2vh, 1.2rem);
            text-align: center;
            background: #fff8f2;
            min-width: 0;
        }

        .field small {
            display: block;
            font-size: clamp(1rem, 2.4vh, 1.25rem);
            color: #6a5d85;
        }

        .field b {
            display: block;
            font-size: clamp(1.5rem, 5vh, 3rem);
            line-height: 1.1;
            overflow-wrap: anywhere;
        }

        .preview {
            max-width: 100%;
            max-height: 100%;
            border-radius: 16px;
            border: 3px solid var(--c);
            object-fit: contain;
        }

        @media (max-width: 900px) {
            .fields {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .chq {
                animation: none;
            }
        }
    </style>

</head>

<body class="orange">
    <div class="shell">

        <header class="bar">
            <a class="btn-home" href="index.html">&#8962; <span data-ui="home">Home</span></a>
            <h1 class="title display"><span class="swatch"></span><span id="pageTitle"></span></h1>
            <span class="demo" id="demoTag" data-ui="demo" hidden>Demo data</span>
            <div class="lang" role="group" aria-label="Language / भाषा">
                <input type="radio" class="btn-check" name="lang" id="langEn" autocomplete="off" checked>
                <label class="btn" for="langEn">English</label>
                <input type="radio" class="btn-check" name="lang" id="langHi" autocomplete="off">
                <label class="btn" for="langHi" lang="hi">हिन्दी</label>
            </div>
        </header>

        <div class="layout">
            <!-- voice guide: orb + live captions (no controls needed, it speaks by itself) -->
            <aside class="guide" aria-live="polite">
                <div class="orb-wrap" aria-hidden="true">
                    <span class="orb-wave"></span><span class="orb-wave w2"></span><span class="orb-wave w3"></span>
                    <div class="orb">
                        <span class="bar-eq" style="--h:26%;--d:0s"></span><span class="bar-eq"
                            style="--h:46%;--d:.15s"></span><span class="bar-eq" style="--h:66%;--d:.3s"></span><span
                            class="bar-eq" style="--h:46%;--d:.45s"></span><span class="bar-eq"
                            style="--h:26%;--d:.6s"></span>
                    </div>
                </div>
                <p class="caption"><span class="dot" id="capDot" hidden></span><span id="capText"></span></p>
                <button type="button" class="btn-hear" id="hearBtn">&#128266; <span data-ui="hear">Hear
                        again</span></button>
            </aside>

            <main class="work">
                <ol class="stepper" id="stepper" aria-label="Progress"></ol>
                <section class="stage" id="stage"></section>
                <div class="actions" id="actions"></div>
            </main>
        </div>
    </div>

    <script>
        /* Smart Banking Kiosk - shared logic for every task page.
           Provides: language (kioskLang), one-way voice guide with live captions, stepper,
           API helper with demo fallback (frontend works before the backend exists), idle-return-to-home. */
        (() => {
            "use strict";
            const $ = (id) => document.getElementById(id);
            const ls = {
                get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
            };
            const LOCALE = { en: "en-IN", hi: "hi-IN" };
            const UI = {
                en: {
                    home: "Home", hear: "Hear again", demo: "Demo data", idle: "Hello! I am your voice guide.",
                    bye: "No activity. Going back to the home page."
                },
                hi: {
                    home: "होम", hear: "फिर से सुनें", demo: "डेमो डेटा", idle: "नमस्ते! मैं आपका आवाज़ सहायक हूँ।",
                    bye: "कोई गतिविधि नहीं हुई। होम पेज पर लौट रहे हैं।"
                }
            };
            const HOME_AFTER_MS = 90000;   // return to the home page after 90 s without a touch
            const REPEAT_MS = 30000;       // the guide repeats itself after 30 s of silence

            const K = window.Kiosk = {
                lang: ls.get("kioskLang") === "hi" ? "hi" : "en",
                busy: false,        // set true while something is processing (blocks idle-home and auto-repeat)
                demo: false,        // becomes true when any API call fell back to demo data
                render: null,       // page-supplied function, called on load and when the language changes
                spotFn: null,       // optional: page highlights the thing being spoken about (key)
                _tok: 0, _rep: null, _last: null
            };

            /* ---------- small helpers ---------- */
            K.t = (o) => (o && typeof o === "object" && K.lang in o ? o[K.lang] : o);
            K.ui = (k) => UI[K.lang][k];
            K.locale = () => LOCALE[K.lang];
            K.setTitle = (o) => { const t = K.t(o); $("pageTitle").textContent = t; document.title = t + " | Smart Bank Kiosk"; };
            K.stepper = (labels, cur) => {
                $("stepper").innerHTML = labels.map((l, i) =>
                    `<li class="${i + 1 < cur ? "done" : i + 1 === cur ? "active" : ""}"><span class="n">${i + 1 < cur ? "&#10003;" : i + 1}</span><span class="lb">${K.t(l)}</span></li>`).join("");
            };

            /* ---------- voice output ---------- */
            const synth = window.speechSynthesis;
            let voices = [], started = false;
            if (synth) { voices = synth.getVoices(); synth.onvoiceschanged = () => { voices = synth.getVoices(); }; }
            function pickVoice() {
                const code = K.lang === "hi" ? "hi" : "en";
                const m = voices.filter((v) => v.lang.toLowerCase().startsWith(code));
                return (K.lang === "en" && m.find((v) => v.lang.toLowerCase() === "en-in")) || m[0] || null;
            }
            function caption(text, color) {
                $("capText").textContent = text || UI[K.lang].idle;
                const dot = $("capDot");
                dot.hidden = !(text && color);
                if (text && color) dot.style.setProperty("--dot", color);
            }

            // items: a string, or {text, key?, color?, onStart?}; several items are read one after another.
            // opts: {repeat: ms (0 = never repeat), onDone: fn}
            K.say = (items, opts = {}) => {
                if (!synth) return;
                const list = [].concat(items).map((i) => (typeof i === "string" ? { text: i } : i));
                K._last = { items: list, opts };
                synth.cancel(); clearTimeout(K._rep);
                const mine = ++K._tok;
                const finish = (err) => {
                    document.body.classList.remove("is-speaking"); caption(null);
                    if (K.spotFn) K.spotFn(null);
                    if (opts.onDone) opts.onDone(err);
                    if (!err && !K.busy && opts.repeat !== 0) K._rep = setTimeout(K.replay, opts.repeat || REPEAT_MS);
                };
                const next = (i) => {
                    if (mine !== K._tok) return;
                    if (i >= list.length) { finish(false); return; }
                    const u = new SpeechSynthesisUtterance(list[i].text);
                    u.lang = LOCALE[K.lang]; u.rate = 0.82;
                    const v = pickVoice(); if (v) u.voice = v;
                    u.onstart = () => {
                        started = true;
                        if (mine !== K._tok) return;
                        document.body.classList.add("is-speaking");
                        caption(list[i].text, list[i].color);
                        if (K.spotFn) K.spotFn(list[i].key || null);
                        if (list[i].onStart) list[i].onStart();
                    };
                    u.onend = () => next(i + 1);
                    u.onerror = () => { if (mine === K._tok) finish(true); };
                    synth.speak(u);
                };
                next(0);
            };
            K.replay = () => { if (K._last) K.say(K._last.items, K._last.opts); };
            K.stop = () => {
                K._tok++; clearTimeout(K._rep); if (synth) synth.cancel();
                document.body.classList.remove("is-speaking"); caption(null);
            };

            /* ---------- backend calls (demo fallback until the Flask API exists) ---------- */
            // Returns {ok, data, demo}. A 404 or a network error uses `demo` data, so pages work without the backend.
            K.api = async (url, opts = {}, demo) => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), opts.timeout || 8000);
                try {
                    const res = await fetch(url, { ...opts, signal: ctrl.signal });
                    clearTimeout(timer);
                    if (res.ok) return { ok: true, data: await res.json(), demo: false };
                    if (res.status !== 404) return { ok: false, data: null, demo: false };
                } catch { clearTimeout(timer); }
                if (demo === undefined) return { ok: false, data: null, demo: false };
                K.demo = true; $("demoTag").hidden = false;
                return { ok: true, data: demo, demo: true };
            };

            /* ---------- start-up ---------- */
            function applyUI() {
                document.documentElement.lang = K.lang;
                document.querySelectorAll("[data-ui]").forEach((n) => { n.textContent = UI[K.lang][n.dataset.ui]; });
            }
            K.init = (renderFn) => {
                K.render = renderFn;
                $(K.lang === "hi" ? "langHi" : "langEn").checked = true;
                const setLang = (l) => { K.stop(); K.lang = l; ls.set("kioskLang", l); applyUI(); K.render(); };
                $("langEn").addEventListener("change", () => setLang("en"));
                $("langHi").addEventListener("change", () => setLang("hi"));
                $("hearBtn").addEventListener("click", K.replay);
                applyUI(); caption(null); K.render();
            };

            // idle: back to the home page; first touch starts the voice if the browser blocked autoplay
            let idleT = null;
            const resetIdle = () => {
                clearTimeout(idleT);
                idleT = setTimeout(() => {
                    if (K.busy) { resetIdle(); return; }
                    K.say(UI[K.lang].bye, { repeat: 0 });
                    setTimeout(() => { window.location.href = "index.html"; }, 3500);
                }, HOME_AFTER_MS);
            };
            document.addEventListener("pointerdown", () => {
                resetIdle();
                if (!started && K._last) K.replay();
                else if (!document.body.classList.contains("is-speaking")) {
                    clearTimeout(K._rep); if (K._last && !K.busy) K._rep = setTimeout(K.replay, REPEAT_MS);
                }
            }, true);
            document.addEventListener("keydown", resetIdle, true);
            window.addEventListener("pagehide", K.stop);
            resetIdle();
        })();

    </script>

    <script>
        (() => {
            "use strict";
            const $ = (id) => document.getElementById(id);
            const labels = [{ en: "Get ready", hi: "तैयारी" }, { en: "Scan", hi: "स्कैन" }, { en: "Check", hi: "जाँचें" }, { en: "Done", hi: "पूरा" }];
            const STEP_OF = { ready: 1, scan: 2, reading: 2, scanErr: 2, check: 3, saving: 3, done: 4 };

            const X = {
                ready: {
                    t: { en: "Keep your cheque ready", hi: "अपना चेक तैयार रखें" },
                    d: { en: "Place it on the scanner glass with the writing facing down.", hi: "इसे स्कैनर के काँच पर, लिखावट नीचे की ओर करके रखें।" },
                    s: {
                        en: "Please keep your cheque ready. Place it on the scanner glass with the writing facing down. Then press the orange button.",
                        hi: "कृपया अपना चेक तैयार रखें। उसे स्कैनर के काँच पर, लिखावट नीचे की ओर करके रखें। फिर नारंगी बटन दबाएँ।"
                    }
                },
                scan: {
                    t: { en: "Scan your cheque", hi: "अपना चेक स्कैन करें" },
                    d: { en: "Press the orange button to scan.", hi: "स्कैन करने के लिए नारंगी बटन दबाएँ।" },
                    s: { en: "Now press the orange button to scan your cheque.", hi: "अब अपना चेक स्कैन करने के लिए नारंगी बटन दबाएँ।" }
                },
                reading: {
                    t: { en: "Reading your cheque…", hi: "आपका चेक पढ़ा जा रहा है…" },
                    d: { en: "Please wait. Do not remove the cheque.", hi: "कृपया प्रतीक्षा करें। चेक को न हटाएँ।" },
                    s: { en: "Reading your cheque. Please wait. Do not remove the cheque.", hi: "आपका चेक पढ़ा जा रहा है। कृपया प्रतीक्षा करें। चेक को न हटाएँ।" }
                },
                scanErr: {
                    t: { en: "We could not read the cheque", hi: "हम चेक नहीं पढ़ सके" },
                    d: { en: "Place it flat on the glass and try again.", hi: "इसे काँच पर सीधा रखें और फिर कोशिश करें।" },
                    s: {
                        en: "We could not read the cheque. Place it flat on the glass and press the orange button to try again.",
                        hi: "हम चेक नहीं पढ़ सके। उसे काँच पर सीधा रखें और फिर कोशिश करने के लिए नारंगी बटन दबाएँ।"
                    }
                },
                saving: {
                    t: { en: "Depositing your cheque…", hi: "आपका चेक जमा हो रहा है…" },
                    d: { en: "Please wait.", hi: "कृपया प्रतीक्षा करें।" },
                    s: { en: "Depositing your cheque. Please wait.", hi: "आपका चेक जमा हो रहा है। कृपया प्रतीक्षा करें।" }
                }
            };
            const B = {
                ready: { en: "I am ready", hi: "मैं तैयार हूँ" }, scan: { en: "Scan cheque", hi: "चेक स्कैन करें" },
                retry: { en: "Try again", hi: "फिर कोशिश करें" }, yes: { en: "Yes, correct", hi: "हाँ, सही है" },
                no: { en: "No, scan again", hi: "नहीं, फिर स्कैन करें" }, home: { en: "Go to Home", hi: "होम पर जाएँ" },
                back: { en: "Back", hi: "वापस" }
            };
            const L = { no: { en: "Cheque number", hi: "चेक नंबर" }, amt: { en: "Amount", hi: "राशि" }, date: { en: "Date", hi: "तारीख" } };

            let view = "ready", data = null, ref = "", fail = "";
            const file = Object.assign(document.createElement("input"), { type: "file", accept: "image/*", hidden: true });
            file.setAttribute("capture", "environment"); document.body.appendChild(file);

            const money = (n) => "₹ " + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const fdate = (d) => { const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString(Kiosk.locale(), { day: "numeric", month: "long", year: "numeric" }); };
            const spaced = (s) => String(s).split("").join(" ");
            const art = (still) => `<svg class="${still ? "still" : ""}" viewBox="0 0 400 320" role="img" aria-label="Cheque on scanner">
    <rect x="30" y="170" width="340" height="120" rx="20" fill="#46395f"/><rect x="55" y="190" width="290" height="60" rx="8" fill="#d8cfe6"/>
    <g class="chq"><rect x="80" y="110" width="240" height="105" rx="8" fill="#fff" stroke="#a84e14" stroke-width="5"/>
    <rect x="80" y="110" width="240" height="22" rx="6" fill="#a84e14"/><rect x="98" y="148" width="120" height="9" rx="4" fill="#cfc4e0"/>
    <rect x="98" y="168" width="80" height="9" rx="4" fill="#cfc4e0"/><path d="M228 195c10-18 18-18 24-4s14 6 22-8" fill="none" stroke="#2b2140" stroke-width="3" stroke-linecap="round"/></g></svg>`;
            const tick = `<svg viewBox="0 0 400 320" role="img" aria-label="Done"><circle cx="200" cy="160" r="110" fill="#2f7a4f"/><path d="M145 160 l38 38 l75 -80" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            const pbar = `<div class="pbar" style="margin-top:.5rem"><i id="pFill"></i><b id="pNum">0%</b></div>`;

            function setActions(list) {
                $("actions").innerHTML = list.map((b, i) => `<button type="button" class="btn-k ${b.ghost ? "ghost" : ""}" data-i="${i}" ${b.off ? "disabled" : ""}>${Kiosk.t(b.label)}</button>`).join("");
                $("actions").querySelectorAll("button").forEach((el) => el.addEventListener("click", list[el.dataset.i].fn));
            }
            const split = (svg, t, d, extra = "") => `<div class="split">${svg}<div><h2 class="h1">${Kiosk.t(t)}</h2><p class="lead">${Kiosk.t(d)}</p>${extra}</div></div>`;

            function render() {
                const K = Kiosk;
                K.setTitle({ en: "Deposit Cheque", hi: "चेक जमा करें" });
                K.stepper(labels, STEP_OF[view]);
                const stage = $("stage");
                if (view === "ready") { stage.innerHTML = split(art(false), X.ready.t, X.ready.d); setActions([{ label: B.ready, fn: () => go("scan") }]); K.say(K.t(X.ready.s)); }
                else if (view === "scan") { stage.innerHTML = split(art(true), X.scan.t, X.scan.d); setActions([{ label: B.scan, fn: () => file.click() }]); K.say(K.t(X.scan.s)); }
                else if (view === "scanErr") { stage.innerHTML = split(art(true), X.scanErr.t, X.scanErr.d); setActions([{ label: B.retry, fn: () => file.click() }]); K.say(K.t(X.scanErr.s)); }
                else if (view === "reading" || view === "saving") { stage.innerHTML = split(art(true), X[view].t, X[view].d, pbar); setActions([]); K.say(K.t(X[view].s), { repeat: 0 }); }
                else if (view === "check") {
                    stage.innerHTML = `<h2 class="h1">${K.t({ en: "Please check the details", hi: "कृपया जानकारी जाँचें" })}</h2>
        <div class="fields"><div class="field"><small>${K.t(L.no)}</small><b>${data.cheque_no}</b></div>
        <div class="field"><small>${K.t(L.amt)}</small><b>${money(data.amount)}</b></div>
        <div class="field"><small>${K.t(L.date)}</small><b>${fdate(data.date)}</b></div></div>
        ${fail ? `<div class="notice" style="margin-top:var(--gap)">${fail}</div>` : ""}`;
                    setActions([{ label: B.no, ghost: true, fn: () => go("scan") }, { label: B.yes, fn: save }]);
                    const r = Math.floor(data.amount);
                    K.say(K.lang === "hi"
                        ? `कृपया जानकारी जाँचें। चेक नंबर ${spaced(data.cheque_no)}। राशि ${r} रुपये। तारीख ${fdate(data.date)}। सब सही हो तो नारंगी बटन दबाएँ। फिर से स्कैन करने के लिए सफ़ेद बटन दबाएँ।`
                        : `Please check the details. Cheque number ${spaced(data.cheque_no)}. Amount ${r} rupees. Date ${fdate(data.date)}. If everything is correct, press the orange button. To scan again, press the white button.`);
                } else if (view === "done") {
                    stage.innerHTML = split(tick, { en: "Cheque received", hi: "चेक प्राप्त हो गया" }, { en: "Reference number: " + ref, hi: "संदर्भ संख्या: " + ref });
                    setActions([{ label: B.home, fn: () => { window.location.href = "index.html"; } }]);
                    K.say(K.lang === "hi" ? `आपका चेक प्राप्त हो गया है। आपकी संदर्भ संख्या है ${spaced(ref)}। धन्यवाद।` : `Your cheque has been received. Your reference number is ${spaced(ref)}. Thank you.`);
                }
            }
            function go(v) { view = v; render(); }

            function progress(running) {
                let p = 0; const el = () => $("pFill");
                const t = setInterval(() => { if (!el()) return clearInterval(t); p = Math.min(90, p + 6); el().style.width = p + "%"; $("pNum").textContent = p + "%"; }, 200);
                return () => { clearInterval(t); if (el()) { el().style.width = "100%"; $("pNum").textContent = "100%"; } };
            }

            file.addEventListener("change", async () => {
                if (!file.files.length) return;
                const body = new FormData(); body.append("image", file.files[0]); file.value = "";
                view = "reading"; Kiosk.busy = true; render();
                const done = progress();
                // Backend contract: POST /api/cheque/scan (multipart "image") -> {cheque_no, amount, date}
                const demo = { cheque_no: "004512", amount: 25000, date: "2026-11-12" };
                const r = await Kiosk.api("/api/cheque/scan", { method: "POST", body, timeout: 30000 }, demo);
                if (r.demo) await new Promise((x) => setTimeout(x, 1800));
                done(); Kiosk.busy = false;
                if (r.ok && r.data && r.data.cheque_no && r.data.amount) { data = r.data; fail = ""; view = "check"; } else { view = "scanErr"; }
                render();
            });

            async function save() {
                view = "saving"; Kiosk.busy = true; render(); const done = progress();
                // Backend contract: POST /api/cheque/deposit (JSON {cheque_no, amount, date}) -> {status:"ok", reference}
                const demo = { status: "ok", reference: "CHQ" + String(Date.now()).slice(-6) };
                const r = await Kiosk.api("/api/cheque/deposit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }, demo);
                if (r.demo) await new Promise((x) => setTimeout(x, 1500));
                done(); Kiosk.busy = false;
                if (r.ok && r.data.status === "ok") { ref = r.data.reference; view = "done"; }
                else { fail = Kiosk.t({ en: "The cheque could not be deposited. Please ask the bank staff for help.", hi: "चेक जमा नहीं हो सका। कृपया बैंक कर्मचारी से मदद माँगें।" }); view = "check"; }
                render();
            }

            Kiosk.init(render);
        })();
    </script>

</body>

</html>
